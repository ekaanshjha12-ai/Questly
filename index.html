<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="description" content="Turn your goals into daily, weekly and monthly quests." />
    <!-- Lets the app run full-screen when added to a phone's home screen. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Questly" />

    <!-- Browser tab -->
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/icon-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <!-- iOS home screen. Safari ignores the manifest icons and uses this. -->
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>Questly — Turn goals into quests</title>
    <script>
      // Runs before first paint so the page never flashes the wrong theme.
      // Duplicated from useTheme deliberately: the hook cannot run this early,
      // and a flash of the opposite theme on every load is worse than the
      // repetition. Wrapped because storage throws in some private modes.
      (function () {
        try {
          var choice = localStorage.getItem('questly:v1:theme') || 'system'
          var resolved =
            choice === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : choice
          document.documentElement.setAttribute('data-theme', resolved)
          if (resolved === 'light') {
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', '#eef0f6')
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
